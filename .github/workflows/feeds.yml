name: Feeds VTEX

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, minuto 7 (UTC)
  workflow_dispatch:       # botón "Run workflow" para ejecutar a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # los catálogos grandes pueden tardar varios minutos
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Recupera la última publicación para conservar los feeds de una tienda si VTEX falla.
      - name: Recuperar feeds anteriores
        run: |
          mkdir -p public
          if git fetch --depth=1 origin feeds; then git archive FETCH_HEAD | tar -x -C public; fi

      - name: Generar feeds
        id: generar
        continue-on-error: true
        run: node generar-feeds.js

      - name: Guardar copia en la rama feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          rm -rf .git
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4

      # Marca la ejecución en rojo (y GitHub envía correo) si alguna tienda falló.
      - name: Reportar error
        if: steps.generar.outcome == 'failure'
        run: |
          echo "Una o más tiendas fallaron; se publicaron sus feeds anteriores. Revisa el paso 'Generar feeds'."
          exit 1
