name: Feeds VTEX

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, minuto 7 (UTC)
  workflow_dispatch:       # botón "Run workflow" para ejecutar a mano
    inputs:
      tienda:
        description: 'Slug de una tienda (vacío = todas las que les toca)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # los catálogos grandes pueden tardar varios minutos
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Recupera la última publicación para conservar los feeds de una tienda si VTEX falla.
      - name: Recuperar feeds anteriores
        run: |
          mkdir -p public
          if git fetch --depth=1 origin feeds; then git archive FETCH_HEAD | tar -x -C public; fi

      # Fase 1: tiendas pequeñas (< 2.500 productos). Se publican enseguida junto con la app,
      # que ya muestra las tiendas grandes nuevas como "Generando…".
      - name: Generar tiendas pequeñas
        id: pequenas
        continue-on-error: true
        env:
          TIENDA: ${{ inputs.tienda }}
        run: node generar-feeds.js $TIENDA ${TIENDA:+--forzar} --fase=pequenas

      - name: Guardar copia (pequeñas)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/guardar-rama-feeds.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: pages-pequenas

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-pequenas

      # Fase 2: tiendas grandes (2.500 productos o más), una vez al día.
      - name: Generar tiendas grandes
        id: grandes
        continue-on-error: true
        env:
          TIENDA: ${{ inputs.tienda }}
        run: |
          set +e
          node generar-feeds.js $TIENDA ${TIENDA:+--forzar} --fase=grandes | tee grandes.log
          codigo=${PIPESTATUS[0]}
          if grep -q ' productos · SKUs' grandes.log; then echo "publicar=si" >> "$GITHUB_OUTPUT"; fi
          exit $codigo

      - name: Guardar copia (grandes)
        if: steps.grandes.outputs.publicar == 'si'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/guardar-rama-feeds.sh

      - uses: actions/upload-pages-artifact@v3
        if: steps.grandes.outputs.publicar == 'si'
        with:
          path: public
          name: pages-grandes

      - uses: actions/deploy-pages@v4
        if: steps.grandes.outputs.publicar == 'si'
        with:
          artifact_name: pages-grandes

      # Abre un aviso (GitHub envía un correo) cuando el espacio pasa del 80 % o un archivo
      # se acerca a 100 MB; lo cierra cuando vuelve a la normalidad.
      - name: Avisar si el espacio está por llenarse
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f public/uso.json ] || exit 0
          alerta=$(jq -r '.alerta' public/uso.json)
          porcentaje=$(jq -r '.porcentaje' public/uso.json)
          mb=$(jq -r '(.bytes / 1048576 | floor)' public/uso.json)
          mayor=$(jq -r '.archivo_mayor' public/uso.json)
          mayor_mb=$(jq -r '(.archivo_mayor_bytes / 1048576 * 10 | floor) / 10' public/uso.json)
          abierto=$(gh issue list --label espacio --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$alerta" = "true" ] && [ -z "$abierto" ]; then
            gh label create espacio --color e40014 --description "Aviso de espacio de feeds" 2>/dev/null || true
            printf '%s\n' \
              "El espacio gratuito de los feeds está en **${mb} MB de 1024 MB (${porcentaje} %)**." \
              "" \
              "Archivo más grande: \`${mayor}\` (${mayor_mb} MB; el límite por archivo es 100 MB)." \
              "" \
              "Opciones: generar solo los feeds que se usan en las tiendas grandes, o pasar la tienda más grande a su propio repositorio (1 GB gratis adicional)." \
              "" \
              "Este aviso se cierra solo cuando el espacio vuelva a un nivel normal." > aviso.md
            gh issue create --title "⚠️ Espacio de feeds al ${porcentaje} %" --label espacio --body-file aviso.md
          elif [ "$alerta" != "true" ] && [ -n "$abierto" ]; then
            gh issue close "$abierto" --comment "✅ El espacio volvió a un nivel normal: ${mb} MB (${porcentaje} %)."
          fi

      # Marca la ejecución en rojo (y GitHub envía correo) si alguna tienda falló.
      - name: Reportar error
        if: steps.pequenas.outcome == 'failure' || steps.grandes.outcome == 'failure'
        run: |
          echo "Una o más tiendas fallaron; se publicaron sus feeds anteriores. Revisa los pasos 'Generar tiendas'."
          exit 1
